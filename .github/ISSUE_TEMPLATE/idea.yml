name: Idea
description: Suggest something PC Hand-off could check, sign out of, or explain better.
title: "Idea: "
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like PC Hand-off to do, and what problem would it solve for you?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: PC Hand-off version
